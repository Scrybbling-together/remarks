name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # keep CI on the same interpreter the Nix build pins
          python-version: "3.12"

      - name: Install system libraries
        # cairocffi (via rmc -> cairosvg) dlopen()s libcairo at import time
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run tests
        run: uv run pytest -m "not unfinished_feature"
